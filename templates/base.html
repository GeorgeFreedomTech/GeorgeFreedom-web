

<!DOCTYPE html>
<html lang="{{ lang }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
            {{ config.title }}
        {% endblock title %}
    </title>
    
    <meta name="description" content="{% block description %}{% endblock description %}">
    <link rel="icon" type="image/png" href="images/gf-favicon.png">
    <link rel="stylesheet" href="{{ get_url(path='css/style.css') }}">
</head>

<body>
    {% block header %}
        {% include "partials/header.html" %}
    {% endblock header %}

    <main id="main-content">

        {% block content %}
        {% endblock content %}

    </main>

    {% block footer %}
        {% include "partials/footer.html" %}
    {% endblock footer %}

    {% block scripts %}
        <script src="{{ get_url(path='js/theme.js') }}" defer></script>
        <script type="module" src="{{ get_url(path='js/mermaid.js') }}"></script>
    {% endblock scripts %}
</body>
</html>
